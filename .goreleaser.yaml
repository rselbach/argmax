# goreleaser configuration for argmax.
#
# Archive and checksum names must stay in sync with internal/update, which
# downloads "argmax_<os>_<arch>.tar.gz" and verifies it against
# "checksums.txt".
version: 2
project_name: argmax

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: argmax
    main: ./cmd/argmax
    binary: argmax
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: tarballs
    formats: [tar.gz]
    name_template: "argmax_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - NOTICE
      - README*

# Publish a workflow-owned source archive instead of relying on GitHub's
# generated tag archives. Source archives are included in checksums.txt.
source:
  enabled: true
  name_template: "{{ .ProjectName }}-{{ .Version }}-source"
  format: tar.gz
  prefix_template: "{{ .ProjectName }}-{{ .Version }}/"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: dev

release:
  # Nightly tags such as v1.4.0-nightly.20260801 publish as prereleases,
  # which the stable update channel ignores.
  prerelease: auto

nfpms:
  - id: packages
    package_name: argmax
    formats: [deb, rpm]
    vendor: Roberto Selbach
    homepage: https://github.com/rselbach/argmax
    maintainer: Roberto Selbach <roberto.selbach@gmail.com>
    description: Terminal-resident command completion and prediction
    license: MIT
    bindir: /usr/bin
    scripts:
      preremove: scripts/nfpm-preremove.sh

brews:
  - name: argmax
    # Modern Homebrew only resolves formulae under Formula/.
    directory: Formula
    repository:
      owner: rselbach
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # The default workflow token cannot push to the tap repository; skip
    # the formula upload until the secret exists, then it enables itself.
    skip_upload: "{{ if .Env.HOMEBREW_TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}"
    homepage: https://github.com/rselbach/argmax
    description: Terminal-resident command completion and prediction
    license: MIT
    install: |
      bin.install "argmax"
    caveats: |
      Run "argmax setup" to install shell integration, and
      "argmax uninstall" before removing the package.
