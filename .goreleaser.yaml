# goreleaser configuration for argmax.
#
# Archive and checksum names must stay in sync with internal/updater, which
# downloads "argmax_<os>_<arch>.tar.gz" and verifies it against
# "checksums.txt" (scripts/install.sh uses the same names).
version: 2
project_name: argmax

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: argmax
    main: ./cmd/argmax
    binary: argmax
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: tarballs
    formats: [tar.gz]
    name_template: "argmax_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - NOTICE
      - README*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: dev

release:
  # Nightly tags such as v1.4.0-nightly.20260801 publish as prereleases,
  # which the stable update channel ignores.
  prerelease: auto

nfpms:
  - id: packages
    package_name: argmax
    formats: [deb, rpm]
    vendor: Roberto Selbach
    homepage: https://github.com/rselbach/argmax
    maintainer: Roberto Selbach <roberto.selbach@gmail.com>
    description: Terminal-resident command completion and prediction
    license: MIT
    bindir: /usr/bin
    scripts:
      preremove: scripts/nfpm-preremove.sh

homebrew_casks:
  - name: argmax
    repository:
      owner: rselbach
      name: homebrew-tap
    homepage: https://github.com/rselbach/argmax
    description: Terminal-resident command completion and prediction
    license: MIT
    # Only attempt the tap push when the token secret is configured,
    # so releases without it stay green.
    skip_upload: "{{ if envOrDefault \"HOMEBREW_TAP_GITHUB_TOKEN\" \"\" }}false{{ else }}true{{ end }}"
    binaries:
      - argmax
    hooks:
      post:
        # The binary is not code-signed; remove the quarantine attribute on
        # macOS or Gatekeeper reports it as damaged. Visible in the cask.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/argmax"]
          end
    caveats: |
      Run "argmax setup" to install shell integration, and
      "argmax uninstall" before removing the package.
      The binary is unsigned; the cask removes the quarantine attribute
      on install (shown above) so macOS will run it.

