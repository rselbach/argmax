name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests (race)
        run: go test -race ./...
      - name: Fig exporter vet and tests
        working-directory: tools/figexport
        run: |
          go vet ./...
          go test -race ./...
      - name: Benchmarks compile and run once
        run: go test -run NONE -bench . -benchtime 1x ./...
      - name: Tools build
        run: |
          go build ./tools/cataloggen ./tools/docgen
          cd tools/figexport && go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck scripts/install.sh scripts/nfpm-preremove.sh scripts/render-aur.sh
