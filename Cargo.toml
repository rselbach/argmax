[package]
name = "argmax"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A local, terminal-native command assistant"
license = "MIT"
publish = false

[dependencies]
clap = { version = "=4.6.4", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
] }
directories = "=6.0.0"
nix = { version = "=0.28.0", default-features = false, features = [
  "fs",
  "process",
  "signal",
  "term",
] }
portable-pty = { version = "=0.9.0", default-features = false }
rusqlite = { version = "=0.34.0", default-features = false, features = [
  "bundled",
] }
rustix = { version = "=1.1.4", default-features = false, features = ["fs"] }
serde = { version = "=1.0.229", default-features = false, features = [
  "std",
  "derive",
] }
serde_json = { version = "=1.0.151", default-features = false, features = [
  "std",
] }
sha2 = { version = "=0.11.0", default-features = false }
signal-hook = { version = "=0.4.4", default-features = false, features = [
  "iterator",
] }
tempfile = "=3.27.0"
toml = { version = "=1.1.3", default-features = false, features = [
  "std",
  "serde",
  "parse",
  "display",
] }
unicode-segmentation = "=1.13.3"
unicode-width = { version = "=0.2.2", default-features = false }
ureq = { version = "=3.3.0", default-features = false, features = [
  "rustls",
  "json",
] }
vte = { version = "=0.15.0", default-features = false, features = [
  "std",
  "ansi",
] }

[lib]
name = "argmax"
path = "src/lib.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
